<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<title>ローバーミニ MEMS診断</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <div class="badge" id="badge">未接続</div>
  <nav class="tabs" id="tabs" hidden>
    <button data-view="analog">アナログ</button>
    <button data-view="simple">シンプル</button>
    <button data-view="detail">詳細</button>
  </nav>
  <button class="stop" id="btnStop" hidden>切断</button>
</header>

<main>
  <!-- 接続画面 -->
  <section class="view connect" id="viewConnect">
    <h1>ローバーミニ MEMS診断</h1>
    <p class="lead">Bluetoothアダプター（ATOM Lite）経由で、エンジンのコンピューター（MEMS 1.3）のデータを表示します。</p>
    <p class="msg" id="connectMsg" hidden></p>
    <div class="buttons">
      <button class="primary" id="btnReconnect" hidden>もう一度つなぐ</button>
      <button class="primary" id="btnConnect">Bluetoothで接続</button>
      <button class="secondary" id="btnDemo">デモモードで開始</button>
    </div>
    <p class="note" id="supportNote"></p>
    <p class="note">デモモード: 実車やアダプターが無くても、サンプルデータで画面をお試しいただけます。</p>
  </section>

  <!-- アナログメーター -->
  <section class="view analog" id="viewAnalog" hidden>
    <div class="dials" id="dials">
      <div class="gauge" id="gauge0"><img class="face" alt=""><img class="needle" src="img/needle.png" alt=""><div class="digital"><span></span></div></div>
      <div class="gauge" id="gauge1"><img class="face" alt=""><img class="needle" src="img/needle.png" alt=""><div class="digital"><span></span></div></div>
    </div>
    <div class="lamps" id="lamps"></div>
    <button class="flip" id="btnFlip" aria-label="メーターを切り替え">⇆</button>
  </section>

  <!-- シンプル -->
  <section class="view simple" id="viewSimple" hidden>
    <div class="banner" id="bannerSimple"></div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- 詳細 -->
  <section class="view detail" id="viewDetail" hidden>
    <div class="banner" id="bannerDetail"></div>
    <table class="rows" id="detailRows"></table>
    <h2>センサーエラー診断</h2>
    <table class="rows" id="faultRows"></table>
    <button class="secondary" id="btnClearFaults">エラークリア</button>
    <p class="note" id="rateNote"></p>
  </section>
</main>

<details class="diag" id="diag">
  <summary>診断用の記録</summary>
  <label><input type="checkbox" id="optRaw"> 送受信を全部記録する</label>
  <div class="diag-buttons">
    <button class="secondary" id="btnCopyLog">記録をコピー</button>
    <button class="secondary" id="btnClearLog">記録を消す</button>
  </div>
  <pre id="log"></pre>
  <p class="note"><a href="test.html">接続テスト用ページ</a></p>
</details>

<dialog id="infoDialog">
  <h3 id="infoTitle"></h3>
  <p id="infoDesc"></p>
  <p class="range" id="infoRange"></p>
  <form method="dialog"><button class="primary">閉じる</button></form>
</dialog>

<script src="app.js"></script>
</body>
</html>
