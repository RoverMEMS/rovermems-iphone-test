<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<title>ローバーミニ MEMS診断</title>
<link rel="stylesheet" href="style.css?v=20261006">
</head>
<body>

<!-- 夜間モード: Android版は画面の明るさを下げる。ウェブでは明るさを変えられないので黒い膜をかぶせる -->
<div id="nightOverlay" hidden></div>

<!-- 文言は app.js の I18N から入る（data-i18n のキー）。Android版 strings.xml / values-en と同じ -->
<header class="bar" id="bar">
  <div class="title" id="barTitle"></div>
  <div class="bar-actions">
    <button class="lang" id="btnLang">EN</button>
    <button class="icon" id="btnNight">🌙</button>
    <button class="icon" id="btnMenu" hidden>⋮</button>
  </div>
  <div class="menu" id="menu" hidden>
    <button data-mode="simple" data-i18n="modeSimple"></button>
    <button data-mode="detail" data-i18n="modeDetail"></button>
    <button data-mode="charts" data-i18n="modeCharts"></button>
    <button data-mode="analog" data-i18n="modeAnalog"></button>
    <hr>
    <button data-go="actuator" data-i18n="actuatorTitle"></button>
    <button data-go="logs" data-i18n="logList"></button>
  </div>
</header>

<main>
  <!-- 接続画面 -->
  <section class="view connect" id="viewConnect">
    <p class="lead" data-i18n="lead"></p>
    <p class="msg" id="connectMsg" hidden></p>
    <div class="buttons">
      <button class="primary" id="btnReconnect" data-i18n="reconnect" hidden></button>
      <button class="primary" id="btnConnect"></button>
      <button class="secondary" id="btnDemo" data-i18n="startDemo"></button>
      <button class="secondary" id="btnOpenLogs" data-i18n="openLogs"></button>
    </div>
    <p class="note" id="supportNote"></p>
    <p class="note" data-i18n="demoNote"></p>
  </section>

  <!-- 接続後の画面（シンプル／詳細／グラフ） -->
  <section class="view live" id="viewLive" hidden>
    <div class="banner" id="banner" hidden></div>
    <button class="primary wide" id="btnClearFaults" data-i18n="clearFaults"></button>
    <p class="status-line" id="recordingLine" hidden></p>
    <p class="status-line" id="liveMsg" hidden></p>
    <p class="waiting" id="waiting" data-i18n="waiting"></p>
    <div class="panel" id="panelSimple" hidden><div class="cards" id="cards"></div></div>
    <div class="panel" id="panelDetail" hidden>
      <table class="rows" id="detailRows"></table>
      <h2 data-i18n="faultSection"></h2>
      <table class="rows" id="faultRows"></table>
    </div>
    <div class="panel" id="panelCharts" hidden>
      <p class="waiting" id="chartsWaiting" data-i18n="chartsNotEnough"></p>
      <div id="liveCharts"></div>
    </div>
    <button class="primary wide" id="btnStop"></button>
  </section>

  <!-- アナログ（全画面） -->
  <section class="view analog" id="viewAnalog" hidden>
    <div class="dials" id="dials">
      <div class="gauge" id="gauge0"><img class="face" alt=""><img class="needle" src="img/needle.png" alt=""><div class="digital"><span></span></div><button class="pick" data-slot="0">⋮</button></div>
      <div class="gauge" id="gauge1"><img class="face" alt=""><img class="needle" src="img/needle.png" alt=""><div class="digital"><span></span></div><button class="pick" data-slot="1">⋮</button></div>
    </div>
    <p class="analog-waiting" id="analogWaiting" data-i18n="waiting"></p>
    <button class="analog-back" id="btnAnalogBack" data-i18n="modeSimple"></button>
    <div class="analog-top">
      <div class="clock" id="clock">--:--</div>
      <button class="round" id="btnNightAnalog">🌙</button>
    </div>
    <div class="lamps" id="lamps"></div>
    <button class="reconnect" id="btnAnalogReconnect" hidden>⟳</button>
  </section>

  <!-- 部品テスト -->
  <section class="view actuator" id="viewActuator" hidden>
    <div class="act-card">
      <p data-i18n="actuatorDesc"></p>
      <div class="act-status" id="actStatus"></div>
    </div>
    <div class="act-result" id="actResult" hidden></div>
    <div id="actRows"></div>
    <button class="primary wide" data-back data-i18n="back"></button>
  </section>

  <!-- ログ一覧 -->
  <section class="view logs" id="viewLogs" hidden>
    <p class="note" data-i18n="logsNote"></p>
    <p class="waiting" id="logsEmpty" data-i18n="logsEmpty" hidden></p>
    <div id="logList"></div>
    <div class="row-buttons">
      <button class="primary" id="btnRefreshLogs" data-i18n="refresh"></button>
      <button class="primary" data-back data-i18n="back"></button>
    </div>
  </section>

  <!-- ログのグラフ -->
  <section class="view logchart" id="viewLogChart" hidden>
    <p class="waiting" id="logChartMsg"></p>
    <div id="logCharts"></div>
    <button class="primary wide" data-back data-i18n="back"></button>
  </section>
</main>

<details class="diag" id="diag">
  <summary data-i18n="diagTitle"></summary>
  <p class="note" id="rateNote"></p>
  <label><input type="checkbox" id="optRaw"> <span data-i18n="diagRaw"></span></label>
  <div class="diag-buttons">
    <button class="secondary" id="btnCopyLog" data-i18n="copyLog"></button>
    <button class="secondary" id="btnClearLog" data-i18n="clearLog"></button>
  </div>
  <pre id="log"></pre>
  <p class="note"><a href="test.html" data-i18n="testPage"></a></p>
</details>

<dialog id="infoDialog">
  <h3 id="infoTitle"></h3>
  <p id="infoDesc"></p>
  <p class="range" id="infoRange"></p>
  <form method="dialog"><button class="primary wide" data-i18n="close"></button></form>
</dialog>

<dialog id="pickDialog">
  <h3 data-i18n="selectGauge"></h3>
  <div id="pickOptions"></div>
  <form method="dialog"><button class="secondary wide" data-i18n="cancel"></button></form>
</dialog>

<script src="app.js?v=20261006"></script>
</body>
</html>
